o'" font-size="18" font-weight="700" fill="#10243A" text-anchor="middle">«server» Máy chủ ứng dụng (1 máy)</text><rect x="550" y="110" width="500" height="70" rx="6" fill="#EDE6F7" stroke="#10243A" stroke-width="1.6" opacity="1"/><text x="800" y="138.6" font-family="'Be Vietnam Pro'" font-size="16" font-weight="600" fill="#10243A" text-anchor="middle">«artifact» chobay (Flask)</text><text x="800" y="158.6" font-family="'Be Vietnam Pro'" font-size="16" font-weight="600" fill="#10243A" text-anchor="middle">view · controller · service · dao</text><rect x="550" y="196" width="500" height="70" rx="6" fill="#DDF0E6" stroke="#10243A" stroke-width="1.6" opacity="1"/><text x="800" y="224.6" font-family="'Be Vietnam Pro'" font-size="16" font-weight="600" fill="#10243A" text-anchor="middle">«artifact» AI (ai.search, ai.delivery)</text><text x="800" y="244.6" font-family="'Be Vietnam Pro'" font-size="16" font-weight="600" fill="#10243A" text-anchor="middle">MobileNet · GradientBoosting · LogisticRegression</text><rect x="550" y="282" width="500" height="54" rx="6" fill="#F3EEE2" stroke="#10243A" stroke-width="1.6" opacity="1"/><text x="800" y="312.6" font-family="'Be Vietnam Pro'" font-size="16" font-weight="600" fill="#10243A" text-anchor="middle">«artifact» models/*.h5 · catalog_mean.npy</text><polygon points="520,470 536,454 1096,454 1080,470" fill="#E6EEF9" stroke="#10243A" stroke-width="2"/><polygon points="1080,470 1096,454 1096,604 1080,620" fill="#E6EEF9" stroke="#10243A" stroke-width="2"/><rect x="520" y="470" width="560" height="150" rx="0" fill="#FFFDF8" stroke="#10243A" stroke-width="2" opacity="1"/><text x="800.0" y="498" font-family="'Be Vietnam Pro'" font-size="18" font-weight="700" fill="#10243A" text-anchor="middle">«server» Cơ sở dữ liệu</text><text x="800.0" y="526.0" font-family="'Be Vietnam Pro'" font-size="17" font-weight="400" fill="#4E5D70" text-anchor="middle">SQLite — tệp db/chobay.db</text><text x="800.0" y="548.95" font-family="'Be Vietnam Pro'" font