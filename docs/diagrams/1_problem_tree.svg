</defs><rect x="0" y="0" width="1664" height="760" fill="#FFFDF8"/><text x="20" y="30" font-family="'Be Vietnam Pro'" font-size="16" font-weight="700" fill="#4E5D70" text-anchor="start">HẬU QUẢ</text><rect x="20" y="44" width="310" height="80" rx="10" fill="#FDEBE4" stroke="#10243A" stroke-width="2" opacity="1"/><text x="175.0" y="78.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">Khách bỏ đi,</text><text x="175.0" y="96.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">mất đơn</text><rect x="348" y="44" width="310" height="80" rx="10" fill="#FDEBE4" stroke="#10243A" stroke-width="2" opacity="1"/><text x="503.0" y="78.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">Khiếu nại hàng hỏng,</text><text x="503.0" y="96.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">hoàn tiền</text><rect x="676" y="44" width="310" height="80" rx="10" fill="#FDEBE4" stroke="#10243A" stroke-width="2" opacity="1"/><text x="831.0" y="78.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">Không bán được tới</text><text x="831.0" y="96.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">xã đảo, ven sông</text><rect x="1004" y="44" width="310" height="80" rx="10" fill="#FDEBE4" stroke="#10243A" stroke-width="2" opacity="1"/><text x="1159.0" y="78.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">Hủy đơn vì hết hàng,</text><text x="1159.0" y="96.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">mất uy tín</text><rect x="1332" y="44" width="310" height="80" rx="10" fill="#FDEBE4" stroke="#10243A" stroke-width="2" opacity="1"/><text x="1487.0" y="78.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">Nhân viên mất giờ</text><text x="1487.0" y="96.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="500" fill="#10243A" text-anchor="middle">trả lời “đơn đâu?”</text><rect x="432" y="178" width="800" height="78" rx="10" fill="#10243A" stroke="#10243A" stroke-width="2" opacity="1"/><text x="832.0" y="222.4" font-family="'Be Vietnam Pro'" font-size="24" font-weight="700" fill="#F7F4EC" text-anchor="middle">Bán &amp; giao tạp hóa online kém hiệu quả</text><text x="20" y="312" font-family="'Be Vietnam Pro'" font-size="16" font-weight="700" fill="#4E5D70" text-anchor="start">VẤN ĐỀ</text><rect x="20" y="326" width="310" height="108" rx="10" fill="#E3ECF5" stroke="#10243A" stroke-width="2" opacity="1"/><text x="175.0" y="364.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">P1 Khách khó tìm hàng:</text><text x="175.0" y="383.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">gõ không dấu, gọi tên</text><text x="175.0" y="402.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">khác, chỉ có ảnh</text><rect x="348" y="326" width="310" height="108" rx="10" fill="#E3ECF5" stroke="#10243A" stroke-width="2" opacity="1"/><text x="503.0" y="374.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">P2 Hàng tươi, đông lạnh</text><text x="503.0" y="392.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">hỏng trên đường giao</text><rect x="676" y="326" width="310" height="108" rx="10" fill="#E3ECF5" stroke="#10243A" stroke-width="2" opacity="1"/><text x="831.0" y="364.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">P3 Chỉ giao bằng xe máy:</text><text x="831.0" y="383.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">kẹt xe, mưa, không</text><text x="831.0" y="402.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">ra được đảo</text><rect x="1004" y="326" width="310" height="108" rx="10" fill="#E3ECF5" stroke="#10243A" stroke-width="2" opacity="1"/><text x="1159.0" y="374.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">P4 Tồn kho lệch,</text><text x="1159.0" y="392.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">bán quá số hàng còn</text><rect x="1332" y="326" width="310" height="108" rx="10" fill="#E3ECF5" stroke="#10243A" stroke-width="2" opacity="1"/><text x="1487.0" y="374.0" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">P5 Khách không biết</text><text x="1487.0" y="392.75" font-family="'Be Vietnam Pro'" font-size="15" font-weight="600" fill="#10243A" text-anchor="middle">đơn đang ở đâu</text><text x="20" y="512" font-family="'Be Vietnam Pro'" font-size="16" font-weight="700" fill="#4E5D70" text-anchor="start">NGUYÊN NHÂN GỐC</text><rect x="20" y="526" width="310" height="116" rx="10" fill="#FFF6DA" stroke="#10243A" stroke-width="2" opacity="1"/><text x="175.0" y="568.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">Tìm theo từ khóa đúng;</text><text x="175.0" y="587.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">không hiểu ý định,</text><text x="175.0" y="606.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">hình ảnh</text><rect x="348" y="526" width="310" height="116" rx="10" fill="#FFF6DA" stroke="#10243A" stroke-width="2" opacity="1"/><text x="503.0" y="568.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">Không phân loại hàng</text><text x="503.0" y="587.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">theo nhiệt độ; shipper</text><text x="503.0" y="606.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">không có thùng lạnh</text><rect x="676" y="526" width="310" height="116" rx="10" fill="#FFF6DA" stroke="#10243A" stroke-width="2" opacity="1"/><text x="831.0" y="568.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">Một phương thức giao;</text><text x="831.0" y="587.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">không dữ liệu thời tiết,</text><text x="831.0" y="606.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">quãng đường</text><rect x="1004" y="526" width="310" height="116" rx="10" fill="#FFF6DA" stroke="#10243A" stroke-width="2" opacity="1"/><text x="1159.0" y="568.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">Đơn ghi tay qua Zalo;</text><text x="1159.0" y="587.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">trừ kho cuối ngày</text><text x="1159.0" y="606.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">bằng tay</text><rect x="1332" y="526" width="310" height="116" rx="10" fill="#FFF6DA" stroke="#10243A" stroke-width="2" opacity="1"/><text x="1487.0" y="568.625" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">Đơn không có mã;</text><text x="1487.0" y="587.375" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">không ghi vị trí,</text><text x="1487.0" y="606.125" font-family="'Be Vietnam Pro'" font-size="15" font-weight="400" fill="#10243A" text-anchor="middle">trạng thái giao</text><path d="M 432 217.0 L 175.0 217.0 L 175.0 124" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 503.0 178 L 503.0 124" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 831.0 178 L 831.0 124" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1159.0 178 L 1159.0 124" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1232 217.0 L 1487.0 217.0 L 1487.0 124" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 175.0 326 L 175.0 292 L 832.0 292 L 832.0 256" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 503.0 326 L 503.0 292 L 832.0 292 L 832.0 256" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 831.0 326 L 831.0 292 L 832.0 292 L 832.0 256" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1159.0 326 L 1159.0 292 L 832.0 292 L 832.0 256" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1487.0 326 L 1487.0 292 L 832.0 292 L 832.0 256" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 175.0 526 L 175.0 434" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 503.0 526 L 503.0 434" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 831.0 526 L 831.0 434" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1159.0 526 L 1159.0 434" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M 1487.0 526 L 1487.0 434" fill="none" stroke="#10243A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="832" y="700" font-family="'Be Vietnam Pro'" font-size="17" font-weight="400" fill="#4E5D70" text-anchor="middle">Đọc từ dưới lên: nguyên nhân gốc → vấn đề → vấn đề trung tâm → hậu quả · P1–P5 được truy vết tới FR ở bảng vấn đề</text></svg>