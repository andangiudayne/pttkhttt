{# Bản đồ hành trình hub → địa chỉ khách, dùng chung cho trang theo dõi đơn (khách) và chi tiết chuyến (điều phối viên). #}
    {% set last = s.events[-1] if s.events else None %}
    {% set f = 1.0 if s.status.value == 'DELIVERED' else (0.35 if s.status.value == 'IN_TRANSIT' else 0.0) %}
    <svg viewBox="0 0 640 300" width="100%" role="img" aria-label="Bản đồ hành trình">
      {% set water = s.mode.value in ['SUBMARINE','AUTO_BOAT'] %}
      {% set x0, y0, x2, y2 = 80, 220, 548, 96 %}
      {% set x1, y1 = (320, 292) if water else (314, 158) %}
      {% set t = f %}
      {% set vx = (1-t)*(1-t)*x0 + 2*(1-t)*t*x1 + t*t*x2 %}{% set vy = (1-t)*(1-t)*y0 + 2*(1-t)*t*y1 + t*t*y2 %}
      <rect x="0" y="0" width="640" height="300" rx="16" fill="{{ '#BFD7EC' if address.area_type.value == 'ISLAND' else '#E8EEF3' }}"/>
      {% if address.area_type.value == 'ISLAND' %}<path d="M0 0 L250 0 C200 80 150 150 0 190 Z" fill="#E9E1C8"/><ellipse cx="548" cy="96" rx="70" ry="44" fill="#E9E1C8"/>
      {% elif s.mode.value == 'AUTO_BOAT' %}<path d="M0 230 C160 190 320 270 640 120 L640 190 C320 320 160 260 0 300Z" fill="#B9D3EA"/>{% endif %}
      <path d="M{{x0}} {{y0}} Q{{x1}} {{y1}} {{x2}} {{y2}}" fill="none" stroke="#10243A" stroke-width="4" stroke-dasharray="10 8"/>
      <circle cx="{{x0}}" cy="{{y0}}" r="13" fill="#10243A"/><text x="40" y="262" font-size="15" fill="#10243A">{{ hub.name }}</text>
      <rect x="{{x2-12}}" y="{{y2-12}}" width="24" height="24" rx="5" fill="#E4572E"/><text x="420" y="40" font-size="15" fill="#10243A">{{ address.label }} · {{ address.district }}</text>
      <circle cx="{{ vx|round(1) }}" cy="{{ vy|round(1) }}" r="17" fill="#1F8A5B" stroke="#fff" stroke-width="4"/>
    </svg>
